# GitHub Actions Pages deploy (active). Pages source = "GitHub Actions".
name: Deploy Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
# storage plan: contents: write only so this job can list/download the draft "site-data" release (drafts are
# hidden from read-only tokens). It never pushes; the job only runs this repo's own code.
permissions: { contents: write, pages: write, id-token: write, deployments: read }
# v74: a newer deploy cancels older queued/running ones (no pile-up of failure emails); the fetch/reset step below still deploys newest main
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url || steps.d2.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # v26b: a late run must deploy the newest main, not the commit that queued it (checkout alone pins github.sha)
      - run: git fetch --depth=1 origin main && git reset --hard FETCH_HEAD && git log -1 --format='deploying %h %cd'
      # v37: backup logger captures stay in the repo only (merged by the main logger), never on the site
      - run: rm -rf backup
      # storage plan: the generated files come from the newest valid "site-data" bundle when it is newer than the
      # committed stats.json (newer wins, so the box fallback's commits still deploy). No bundle / bad bundle /
      # API error -> the repo is deployed as committed (exactly today's behaviour).
      - name: Overlay the newest site-data bundle
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 .github/collector/site_bundle.py fetch . --repo-stats stats.json || echo "::warning::bundle fetch failed; deploying the repo as committed"
          python3 -c "import json;j=json.load(open('stats.json'));print('deploying stats generated',j.get('generated_str') or j.get('generated'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # v73: a stuck Pages deployment (status never finishes) blocks every later deploy.
      # If the deploy failed, cancel any github-pages deployment older than 4 min that is not finished, then retry once.
      - if: steps.d.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          now=$(date +%s)
          gh api "repos/$R/deployments?environment=github-pages&per_page=10" --jq '.[] | "\(.sha) \(.created_at)"' |
          while read -r sha created; do
            age=$(( now - $(date -d "$created" +%s) ))
            st=$(gh api "repos/$R/pages/deployments/$sha" --jq '.status' 2>/dev/null || echo gone)
            echo "pages deployment $sha age ${age}s status '$st'"
            case "$st" in succeed|deployment_failed|deployment_cancelled|deployment_lost|deployment_content_failed|deployment_perms_error|gone) continue;; esac
            if [ "$age" -gt 240 ]; then echo "cancelling stuck $sha"; gh api -X POST "repos/$R/pages/deployments/$sha/cancel" || true; fi
          done
          sleep 10
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
