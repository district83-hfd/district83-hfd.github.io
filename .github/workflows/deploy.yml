# GitHub Actions Pages deploy (active). Pages source = "GitHub Actions".
name: Deploy Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # v26b: a late run must deploy the newest main, not the commit that queued it (checkout alone pins github.sha)
      - run: git fetch --depth=1 origin main && git reset --hard FETCH_HEAD && git log -1 --format='deploying %h %cd'
      # v37: backup logger captures stay in the repo only (merged by the main logger), never on the site
      - run: rm -rf backup
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
