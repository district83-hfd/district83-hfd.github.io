# Ready-to-use GitHub Actions Pages deploy (NOT active). Needs a publisher token with the "workflow" scope to push
# it to .github/workflows/deploy.yml, then Pages source -> "GitHub Actions" (build_type=workflow).
name: Deploy Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      # v26: always deploy the newest main, not the (possibly 45-min-old) commit that queued this run
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
