# Backup logger: every 5 min, captures the City feed only while the main (box) logger is over 10 min stale,
# and sends one phone push when it is over 15 min stale plus one when it is back. See .github/backup/backup.py.
name: Backup Logger
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
    inputs:
      simulate_stale: { description: "Test: treat the main logger as stale", type: boolean, default: false }
permissions: { contents: write, actions: write }
concurrency: { group: backup-logger, cancel-in-progress: false }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 30 }
      - id: b
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SIMULATE: ${{ inputs.simulate_stale && 'true' || '' }}
        run: python3 .github/backup/backup.py
      - name: Commit only if something changed (rebase-retry, never force)
        id: c
        run: |
          git add backup backup_status.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name="District 83" -c user.email="345840453+d83hfd-publisher@users.noreply.github.com" commit -qm "backup $(TZ=America/Chicago date '+%F %H:%M %Z')"
          for i in 1 2 3 4; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then echo "pushed (try $i)"; echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            git rebase --abort 2>/dev/null; sleep $((i * 7))
          done
          echo "push failed after 4 tries"; exit 1
      - name: Deploy the site only when backup mode starts or ends
        if: steps.b.outputs.flip == '1' && steps.c.outputs.pushed == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
